name: Finish ONE MORE DOOR migration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Copy exact game source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/simplebusiness26/OneMore.git /tmp/onemore
          cp -a /tmp/onemore/games/one-more-door/. ./
          rm -f .github/workflows/migrate-from-onemore.yml .github/workflows/issue-trigger-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move ONE MORE DOOR source into dedicated repository"
          git push
